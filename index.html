<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

</head>
<body>
    <div class="sidebar">
        <!-- Left Side -->
    </div>
    
    </div>
    <!-- Right Side -->
    <div class="content">
        <h1>Sign Up!</h1>
        <div class="signup-info">
    <p class="cursive-text">This is just a simple sign up form.</p>
    <p>Please fill out this form with the correct information.</p>
    <p>All users <strong>must</strong> be 18 years or older!</p>
    <p>This form is just for practice, no data will be shared or stored.</p>
    </div>

    <div class="creation-form">
        <h2>Create an Account!</h2>
        <form action="/signup" method="post">
    <div class="form-row">
    <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>
    </div>
    <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
    </div>
    
  <button type="submit" class="submit-btn">Create Account</button>
  </form>

  <!-- Log in prompt outside or below the form -->
  <p class="login-prompt">Already have an account? <a href="#">Log in</a>
  </p>
</div>
    </form>
    </div> <!-- End of content -->
    <script src="script.js"></script>
</body>
</html>
